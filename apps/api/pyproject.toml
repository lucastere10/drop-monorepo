[project]
name = "drop-api"
version = "0.1.0"
description = "Drop Django API"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.28",
    "django-cors-headers>=4.6",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "gunicorn>=23.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "resend>=2.0",
    "google-cloud-tasks>=2.16",
    "httpx>=0.27",
    "drop-ai",
    "drop-agents",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "ruff>=0.9",
]

[tool.uv.sources]
drop-ai = { workspace = true }
drop-agents = { workspace = true }

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "setup.settings.test"
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["RUF012", "S110"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["ALL"]
"tests/**" = ["E501"]
