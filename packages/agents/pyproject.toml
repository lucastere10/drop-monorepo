[project]
name = "drop-agents"
version = "0.1.0"
description = "Agent runner contract for Drop (ADK later)"
requires-python = ">=3.12"
dependencies = [
    "drop-ai",
    "pydantic>=2.0",
]

[tool.uv.sources]
drop-ai = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drop_agents"]
