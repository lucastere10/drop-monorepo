[project]
name = "drop-ai"
version = "0.1.0"
description = "LLM providers and model registry for Drop"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drop_ai"]
