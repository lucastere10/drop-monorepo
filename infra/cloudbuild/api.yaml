# Drop API — Cloud Build (deploy to Cloud Run)
#
# Non-secret config: substitutions (override in the trigger).
# Defaults below are PLACEHOLDERS (example.com), not real hosts.
#   develop → hml:  _DROP_ENV=hml  + real _WEB_BASE_URL / _API_BASE_URL
#   main    → prod: _DROP_ENV=prod + real URLs
# Secrets: Secret Manager names drop-* mounted at deploy.
# Scheduler jobs are created by hand (see docs/runbooks/deploy.md).

substitutions:
  _REGION: us-central1
  _AR_REPO: drop-images
  _SERVICE_API: drop-api
  _API_SA: drop-sa
  _DROP_ENV: prod
  _WEB_BASE_URL: "https://drop.example.com"
  _API_BASE_URL: "https://api.drop.example.com"
  _ALLOWED_HOSTS: "*"
  _GOOGLE_OAUTH_CLIENT_ID: ""
  _EMAIL_FROM: "onboarding@resend.dev"
  _LLM_OVERVIEW: openai:gpt-5.6-luna
  _LLM_INSIGHTS: openai:gpt-5.6-luna
  _LLM_CHAT: openai:gpt-5.6-luna
  _LLM_CHARTS: openai:gpt-5.6-luna
  _CLOUD_TASKS_QUEUE: drop-jobs
  _SCHEDULER_CRON_RENEW: "0 3 1 * *"
  _SCHEDULER_CRON_CLEANUP: "0 4 * * *"
  _SCHEDULER_TZ: America/Sao_Paulo

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 3600s

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/api:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/api:latest

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/drop-database-secret/versions/latest
      env: DATABASE_URL
    - versionName: projects/${PROJECT_ID}/secrets/drop-django-secret-key/versions/latest
      env: DJANGO_SECRET_KEY
    - versionName: projects/${PROJECT_ID}/secrets/drop-resend-key/versions/latest
      env: RESEND_API_KEY
    - versionName: projects/${PROJECT_ID}/secrets/drop-openai-api-key/versions/latest
      env: OPENAI_API_KEY
    - versionName: projects/${PROJECT_ID}/secrets/drop-gemini-api-key/versions/latest
      env: GEMINI_API_KEY
    - versionName: projects/${PROJECT_ID}/secrets/drop-google-oauth-client-secret/versions/latest
      env: GOOGLE_OAUTH_CLIENT_SECRET
    - versionName: projects/${PROJECT_ID}/secrets/drop-internal-worker-token/versions/latest
      env: INTERNAL_WORKER_TOKEN

steps:
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/api:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/api:latest
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/api
    waitFor: ["build-api"]

  - id: migrate
    name: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/api:${SHORT_SHA}
    entrypoint: bash
    secretEnv:
      - DATABASE_URL
      - DJANGO_SECRET_KEY
    args:
      - -c
      - |
        set -euo pipefail
        cd /workspace/apps/api
        export DROP_ENV=${_DROP_ENV}
        uv run python manage.py migrate --noinput
        uv run python manage.py seed_data
    waitFor: ["push-api"]

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    waitFor: ["migrate"]
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run deploy ${_SERVICE_API} \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/api:${SHORT_SHA} \
          --region=${_REGION} \
          --service-account=${_API_SA}@${PROJECT_ID}.iam.gserviceaccount.com \
          --allow-unauthenticated \
          --set-env-vars="DROP_ENV=${_DROP_ENV},WEB_BASE_URL=${_WEB_BASE_URL},API_BASE_URL=${_API_BASE_URL},ALLOWED_HOSTS=${_ALLOWED_HOSTS},GOOGLE_OAUTH_CLIENT_ID=${_GOOGLE_OAUTH_CLIENT_ID},EMAIL_FROM=${_EMAIL_FROM},GCP_PROJECT=${PROJECT_ID},GCP_LOCATION=${_REGION},CLOUD_TASKS_QUEUE=${_CLOUD_TASKS_QUEUE},LLM_OVERVIEW=${_LLM_OVERVIEW},LLM_INSIGHTS=${_LLM_INSIGHTS},LLM_CHAT=${_LLM_CHAT},LLM_CHARTS=${_LLM_CHARTS}" \
          --set-secrets=DATABASE_URL=drop-database-secret:latest,DJANGO_SECRET_KEY=drop-django-secret-key:latest,RESEND_API_KEY=drop-resend-key:latest,OPENAI_API_KEY=drop-openai-api-key:latest,GEMINI_API_KEY=drop-gemini-api-key:latest,GOOGLE_OAUTH_CLIENT_SECRET=drop-google-oauth-client-secret:latest,INTERNAL_WORKER_TOKEN=drop-internal-worker-token:latest
