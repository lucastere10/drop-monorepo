# Drop Web — Cloud Build (deploy to Cloud Run)

substitutions:
  _REGION: us-central1
  _AR_REPO: drop-images
  _SERVICE_WEB: drop-web
  _WEB_SA: drop-sa
  _API_BASE_URL: "https://api.drop.example.com"
  _NEXT_PUBLIC_API_URL: "https://api.drop.example.com"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 3600s

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/web:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/web:latest

steps:
  - id: build-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/web:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/web:latest
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}
      - apps/web

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/web
    waitFor: ["build-web"]

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    waitFor: ["push-web"]
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run deploy ${_SERVICE_WEB} \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/web:${SHORT_SHA} \
          --region=${_REGION} \
          --service-account=${_WEB_SA}@${PROJECT_ID}.iam.gserviceaccount.com \
          --allow-unauthenticated \
          --set-env-vars=API_URL=${_API_BASE_URL},NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}
